<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#c0392b">

  <!-- PWA manifest (Android + Chrome install prompt) -->
  <link rel="manifest" href="manifest.json">

  <!-- iOS home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BNI Empower">
  <link rel="apple-touch-icon" href="icon.svg">

  <title>BNI Empower — Member Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
  <style>
    /* ── Variables (matches Weekly Check-In) ────────────── */
    :root {
      --gold:        #c0392b;
      --gold-bright: #daa94d;
      --gold-dim:    rgba(200,151,58,.12);
      --gold-border: rgba(200,151,58,.35);
      --bg:          #0d0d0d;
      --bg2:         #141414;
      --surface:     #1c1c1c;
      --surface2:    #252525;
      --border:      #2e2e2e;
      --text:        #f0ede8;
      --text-muted:  #888;
      --text-dim:    #4a4a4a;
      --success:     #5cc976;
      --danger:      #e05c5c;
      --r-sm:        8px;
      --r:           14px;
      --r-lg:        18px;
      --tr:          220ms ease;
    }

    /* ── Reset ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-tap-highlight-color: transparent; scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: max(env(safe-area-inset-bottom), 32px);
    }
    a { color: inherit; text-decoration: none; }

    /* ── Header ─────────────────────────────────────────── */
    .header {
      width: 100%;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(12px);
    }
    .logo-mark {
      width: 40px; height: 40px;
      background: var(--gold);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 20px; color: #0d0d0d;
      flex-shrink: 0;
      letter-spacing: -.5px;
      font-family: Georgia, serif;
    }
    .header-text h1 { font-size: 17px; font-weight: 800; line-height: 1.15; letter-spacing: -.2px; }
    .header-text p  { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

    /* ── Container ──────────────────────────────────────── */
    .container {
      width: 100%;
      max-width: 500px;
      padding: 20px 16px 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* ── Greeting ───────────────────────────────────────── */
    .greeting { padding: 2px 4px; }
    .greeting h2 { font-size: 22px; font-weight: 800; letter-spacing: -.4px; }
    .greeting p  { font-size: 13px; color: var(--text-muted); margin-top: 3px; }

    /* ── Section title ──────────────────────────────────── */
    .sec-title {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.2px; color: var(--text-muted);
      padding: 0 4px 2px; display: flex; align-items: center; gap: 8px;
    }
    .sec-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ── Next Meeting card ──────────────────────────────── */
    .meeting-card {
      background: linear-gradient(160deg, var(--surface) 0%, var(--bg2) 100%);
      border: 1px solid var(--gold-border);
      border-radius: var(--r-lg);
      padding: 18px 18px 8px;
      position: relative;
      overflow: hidden;
    }
    .meeting-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--gold), var(--gold-bright));
    }
    .meeting-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
    .meeting-date { font-size: 16px; font-weight: 800; letter-spacing: -.2px; line-height: 1.25; }
    .meeting-sub  { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .badge {
      font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px;
      white-space: nowrap; flex-shrink: 0;
      border: 1px solid var(--gold-border); color: var(--gold-bright); background: var(--gold-dim);
    }
    .badge.online { color: #7fb8e8; border-color: rgba(127,184,232,.35); background: rgba(127,184,232,.1); }

    .pres-row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 2px; border-top: 1px solid var(--border);
    }
    .pres-icon {
      width: 34px; height: 34px; flex-shrink: 0; border-radius: 9px;
      background: var(--surface2); display: flex; align-items: center; justify-content: center;
      color: var(--gold-bright);
    }
    .pres-icon svg { width: 18px; height: 18px; }
    .pres-meta { flex: 1; min-width: 0; }
    .pres-role { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .6px; font-weight: 600; }
    .pres-name { font-size: 15px; font-weight: 700; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pres-name.tbc { color: var(--text-dim); font-weight: 500; font-style: italic; }

    .meeting-skeleton { padding: 6px 2px 14px; }
    .skel { height: 14px; border-radius: 6px; background: var(--surface2); margin: 10px 0; animation: pulse 1.3s ease-in-out infinite; }
    .skel.w60 { width: 60%; } .skel.w40 { width: 40%; } .skel.w80 { width: 80%; }
    @keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: .9; } }

    .upcoming-toggle {
      width: 100%; text-align: center; font-size: 12px; font-weight: 600;
      color: var(--gold-bright); padding: 12px; cursor: pointer;
      border-top: 1px solid var(--border); background: none; border-left: 0; border-right: 0; border-bottom: 0;
      font-family: inherit;
    }
    .upcoming-list { display: none; padding: 4px 2px 12px; }
    .upcoming-list.open { display: block; }
    .up-item { padding: 10px 2px; border-top: 1px solid var(--border); }
    .up-item:first-child { border-top: 0; }
    .up-date { font-size: 13px; font-weight: 700; }
    .up-roles { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.5; }
    .up-roles b { color: var(--text); font-weight: 600; }

    /* ── Primary CTA ────────────────────────────────────── */
    .cta {
      display: flex; align-items: center; gap: 14px;
      background: var(--gold); color: #0d0d0d;
      border-radius: var(--r-lg); padding: 18px 20px;
      font-weight: 800; font-size: 17px; letter-spacing: -.2px;
      box-shadow: 0 8px 24px -8px rgba(192,57,43,.5);
      transition: transform var(--tr), box-shadow var(--tr);
    }
    .cta:active { transform: scale(.98); }
    .cta .cta-icon { width: 40px; height: 40px; flex-shrink: 0; border-radius: 11px;
      background: rgba(0,0,0,.14); display: flex; align-items: center; justify-content: center; }
    .cta .cta-icon svg { width: 22px; height: 22px; }
    .cta .cta-body { flex: 1; }
    .cta .cta-body small { display: block; font-size: 12px; font-weight: 600; opacity: .7; margin-top: 1px; }
    .cta .chev { flex-shrink: 0; opacity: .55; }

    /* ── Tiles grid ─────────────────────────────────────── */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .tile {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); padding: 16px 14px;
      display: flex; flex-direction: column; gap: 10px; min-height: 104px;
      transition: border-color var(--tr), transform var(--tr), background var(--tr);
    }
    .tile:active { transform: scale(.97); }
    @media (hover: hover) { .tile:hover { border-color: var(--gold-border); background: var(--surface2); } }
    .tile-icon {
      width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
      background: var(--gold-dim); border: 1px solid var(--gold-border);
      display: flex; align-items: center; justify-content: center; color: var(--gold-bright);
    }
    .tile-icon svg { width: 20px; height: 20px; }
    .tile-label { font-size: 14px; font-weight: 700; line-height: 1.25; }
    .tile-desc  { font-size: 11.5px; color: var(--text-muted); line-height: 1.35; margin-top: -4px; }
    .tile-full  { grid-column: 1 / -1; flex-direction: row; align-items: center; min-height: 0; }
    .tile-full .tile-body { flex: 1; }

    .list { display: flex; flex-direction: column; gap: 10px; }
    .row {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
      padding: 14px 16px; display: flex; align-items: center; gap: 14px;
      transition: border-color var(--tr), transform var(--tr), background var(--tr);
    }
    .row:active { transform: scale(.98); }
    @media (hover: hover) { .row:hover { border-color: var(--gold-border); background: var(--surface2); } }
    .row .row-icon { width: 36px; height: 36px; flex-shrink: 0; border-radius: 9px;
      background: var(--surface2); display: flex; align-items: center; justify-content: center; color: var(--gold-bright); }
    .row .row-icon svg { width: 18px; height: 18px; }
    .row .row-body { flex: 1; min-width: 0; }
    .row .row-label { font-size: 14.5px; font-weight: 700; }
    .row .row-desc  { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
    .row .chev { flex-shrink: 0; color: var(--text-dim); }

    .placeholder-note {
      font-size: 11px; color: var(--gold-bright); background: var(--gold-dim);
      border: 1px dashed var(--gold-border); border-radius: var(--r-sm);
      padding: 8px 10px; line-height: 1.4;
    }
    .placeholder-note[hidden] { display: none; }

    footer { text-align: center; font-size: 11px; color: var(--text-dim); padding: 28px 16px 8px; line-height: 1.6; }
    footer a { color: var(--text-muted); text-decoration: underline; }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo-mark">B</div>
    <div class="header-text">
      <h1>BNI Empower</h1>
      <p>Member Hub</p>
    </div>
  </header>

  <main class="container">

    <!-- Greeting -->
    <div class="greeting">
      <h2 id="greeting">Welcome 👋</h2>
      <p id="greetingSub">Everything you need for this week, in one place.</p>
    </div>

    <!-- Next Meeting -->
    <section>
      <div class="sec-title">Next Meeting</div>
      <div class="meeting-card">
        <div id="meetingBody">
          <div class="meeting-skeleton">
            <div class="skel w60"></div>
            <div class="skel w80"></div>
            <div class="skel w40"></div>
            <div class="skel w80"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Primary action: Check-In -->
    <a class="cta" id="checkinCta" href="#" target="_blank" rel="noopener">
      <span class="cta-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </span>
      <span class="cta-body">Submit Weekly Check-In<small>Attendance, substitute &amp; visitors</small></span>
      <span class="chev">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </span>
    </a>

    <!-- Resources (Drive) -->
    <section>
      <div class="sec-title">Chapter Resources</div>
      <div class="placeholder-note" id="resPlaceholder" hidden></div>
      <div class="grid" id="resourcesGrid"></div>
    </section>

    <!-- Quick links -->
    <section>
      <div class="sec-title">Quick Links</div>
      <div class="list" id="quickList"></div>
    </section>

    <footer>
      BNI Empower &middot; Members meet every Tuesday<br>
      <a href="#" id="onboardLink" target="_blank" rel="noopener">New member? Complete your onboarding →</a>
    </footer>
  </main>

  <script>
  /* ════════════════════════════════════════════════════════════════════════
     CONFIG — edit the values in this block, then re-deploy.
     ════════════════════════════════════════════════════════════════════════ */

  // Same Apps Script Web App URL used by the Weekly Check-In app.
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxYCpexo7cuQwYMpBwLtVn48hEQAoz1PQw17INXwZpXz-nh7foLB4-8Dhct2a7yNE8lMg/exec';

  // Where the Weekly Check-In app is deployed (GitHub Pages).
  const CHECKIN_URL  = 'https://bnisgempower.github.io/BNI_Sg_Empower/BNI%20Empower%20Weekly%20Check%20In.html';

  // New-member onboarding form (onboarding.html). Set to '' to hide the footer link.
  const ONBOARD_URL  = 'https://bnisgempower.github.io/BNI_Sg_Empower/onboarding.html';

  // ── Chapter Resources — Google Drive folders ──
  // Each: { label, desc, url, icon }.  icon = key from ICONS below.
  // NOTE: each folder must be shared "Anyone with the link → Viewer" or members hit "request access".
  const RESOURCES = [
    { label: 'Member Resources',          desc: 'Chapter documents & guides', url: 'https://drive.google.com/drive/folders/1_R-mePuvxeSxQ6mNqYYUe7t2MJKRime2', icon: 'folder' },
    { label: 'Zoom Recordings',           desc: 'Past meeting replays',        url: 'https://drive.google.com/drive/folders/1VR2hmvfnHas58JvBunNdRKtYPGp6v7Pt', icon: 'video'  },
    { label: 'Featured Presentation Slides', desc: 'Past featured decks',      url: 'https://drive.google.com/drive/folders/1MkKypjwZNsHd1SuZdOK3oVo2RcFH0M9A', icon: 'slides' },
  ];

  // ── Quick Links — internal tools & handy pages (optional) ──
  // Add rows as { label, desc, url, icon }. Any row whose url is a placeholder is hidden.
  // The whole section auto-hides while this is empty. Example row:
  //   { label: 'WhatsApp Group', desc: 'Chapter announcements', url: 'https://chat.whatsapp.com/XXXX', icon: 'chat' },
  const QUICK_LINKS = [];

  /* ════════════════════════════════════════════════════════════════════════
     END CONFIG — no need to edit below.
     ════════════════════════════════════════════════════════════════════════ */

  const PLACEHOLDER_RE = /^REPLACE|_LEAVE$/i;
  const isPlaceholder = u => !u || PLACEHOLDER_RE.test(u);

  // ── Inline SVG icon set ──
  const ICONS = {
    folder:  '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    video:   '<rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3z"/>',
    slides:  '<rect x="3" y="4" width="18" height="13" rx="1.5"/><path d="M8 21h8M12 17v4"/>',
    sheet:   '<rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M4 9h16M4 15h16M10 3v18"/>',
    team:    '<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 6a3 3 0 0 1 0 6M21 20a6 6 0 0 0-4-5.65"/>',
    id:      '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16a3 3 0 0 1 6 0M15 9h3M15 13h3"/>',
    checkin: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
    chat:    '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
    star:    '<path d="M12 2l3 6.5 7 .9-5 4.8 1.3 7L12 18l-6.3 3.2L7 14.2 2 9.4l7-.9z"/>',
    mic:     '<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/>',
    heart:   '<path d="M12 21C7 17 3 13.5 3 9a4.5 4.5 0 0 1 9-1 4.5 4.5 0 0 1 9 1c0 4.5-4 8-9 12z"/>',
    link:    '<path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/>',
  };
  const svg = (key) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[key] || ICONS.link) + '</svg>';
  const chev = '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';

  // ── Greeting (time of day) ──
  (function () {
    const h = new Date().getHours();
    const part = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
    const saved = localStorage.getItem('bni_member');
    const first = saved ? saved.split(' ')[0] : '';
    document.getElementById('greeting').textContent = part + (first ? ', ' + first : '') + ' 👋';
  })();

  // ── Wire the check-in CTA & onboarding link ──
  (function () {
    const cta = document.getElementById('checkinCta');
    if (isPlaceholder(CHECKIN_URL)) {
      cta.removeAttribute('href');
      cta.style.opacity = '.6';
      cta.style.cursor = 'not-allowed';
      cta.querySelector('.cta-body small').textContent = '⚠️ Set CHECKIN_URL in config';
    } else {
      cta.href = CHECKIN_URL;
    }
    const ob = document.getElementById('onboardLink');
    if (isPlaceholder(ONBOARD_URL)) ob.parentElement.removeChild(ob);
    else ob.href = ONBOARD_URL;
  })();

  // ── Render Resources ──
  (function () {
    const grid = document.getElementById('resourcesGrid');
    const note = document.getElementById('resPlaceholder');
    let unset = 0;
    RESOURCES.forEach(r => {
      const live = !isPlaceholder(r.url);
      if (!live) unset++;
      const a = document.createElement('a');
      a.className = 'tile';
      if (live) { a.href = r.url; a.target = '_blank'; a.rel = 'noopener'; }
      else { a.style.opacity = '.5'; }
      a.innerHTML =
        '<span class="tile-icon">' + svg(r.icon) + '</span>' +
        '<span><span class="tile-label">' + r.label + '</span>' +
        (r.desc ? '<div class="tile-desc">' + r.desc + '</div>' : '') + '</span>';
      grid.appendChild(a);
    });
    if (unset > 0) {
      note.hidden = false;
      note.textContent = '⚙️ ' + unset + ' resource link' + (unset > 1 ? 's' : '') +
        ' not set yet — add your Google Drive URLs in the RESOURCES config block.';
    }
  })();

  // ── Render Quick Links ──
  (function () {
    const list = document.getElementById('quickList');
    QUICK_LINKS.forEach(q => {
      if (isPlaceholder(q.url)) return; // hide unconfigured quick links entirely
      const a = document.createElement('a');
      a.className = 'row';
      a.href = q.url; a.target = '_blank'; a.rel = 'noopener';
      a.innerHTML =
        '<span class="row-icon">' + svg(q.icon) + '</span>' +
        '<span class="row-body"><div class="row-label">' + q.label + '</div>' +
        (q.desc ? '<div class="row-desc">' + q.desc + '</div>' : '') + '</span>' + chev;
      list.appendChild(a);
    });
    if (!list.children.length) {
      list.previousElementSibling.style.display = 'none'; // hide section title
      list.style.display = 'none';
    }
  })();

  // ── Load Next Meeting presenters ──
  const PRES_ROWS = [
    { key: 'coreValue',  role: 'Core Value',          icon: 'heart' },
    { key: 'networkEdu', role: 'Network Education',   icon: 'mic'   },
    { key: 'featured',   role: 'Featured Presentation', icon: 'star' },
  ];

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  function renderMeeting(next, upcoming) {
    const body = document.getElementById('meetingBody');
    if (!next) {
      body.innerHTML = '<div style="padding:8px 2px 16px;color:var(--text-muted);font-size:14px">' +
        'No upcoming meeting scheduled yet. The roster will appear here once it\'s planned.</div>';
      return;
    }
    const online = /online|virtual/i.test(next.type || '');
    let html =
      '<div class="meeting-top">' +
        '<div><div class="meeting-date">' + esc(next.date || 'Next meeting') + '</div>' +
        '<div class="meeting-sub">Who\'s on stage this week</div></div>' +
        (next.type ? '<span class="badge ' + (online ? 'online' : '') + '">' + esc(next.type) + '</span>' : '') +
      '</div>';

    PRES_ROWS.forEach(r => {
      const name = (next[r.key] || '').trim();
      html +=
        '<div class="pres-row">' +
          '<span class="pres-icon">' + svg(r.icon) + '</span>' +
          '<span class="pres-meta"><div class="pres-role">' + r.role + '</div>' +
          '<div class="pres-name ' + (name ? '' : 'tbc') + '">' + (name ? esc(name) : 'To be confirmed') + '</div></span>' +
        '</div>';
    });

    // Upcoming (beyond the next meeting)
    const rest = (upcoming || []).slice(1);
    if (rest.length) {
      html += '<button class="upcoming-toggle" id="upToggle">View upcoming weeks (' + rest.length + ') ▾</button>' +
              '<div class="upcoming-list" id="upList">' +
              rest.map(u =>
                '<div class="up-item"><div class="up-date">' + esc(u.date || '') +
                (u.type ? ' · ' + esc(u.type) : '') + '</div>' +
                '<div class="up-roles">' +
                  'Core Value: <b>' + esc(u.coreValue || 'TBC') + '</b><br>' +
                  'Network Edu: <b>' + esc(u.networkEdu || 'TBC') + '</b><br>' +
                  'Featured: <b>' + esc(u.featured || 'TBC') + '</b>' +
                '</div></div>'
              ).join('') +
              '</div>';
    }

    body.innerHTML = html;

    const toggle = document.getElementById('upToggle');
    if (toggle) toggle.addEventListener('click', () => {
      const l = document.getElementById('upList');
      const open = l.classList.toggle('open');
      toggle.innerHTML = open ? 'Hide upcoming weeks ▴' : 'View upcoming weeks (' + rest.length + ') ▾';
    });
  }

  (async function loadMeeting() {
    try {
      const res  = await fetch(APPS_SCRIPT_URL + '?action=getNextPresenters', { cache: 'no-store' });
      const json = await res.json();
      renderMeeting(json.next, json.upcoming);
    } catch (e) {
      document.getElementById('meetingBody').innerHTML =
        '<div style="padding:8px 2px 16px;color:var(--danger);font-size:13px">' +
        'Couldn\'t load the roster right now. Pull to refresh, or check back later.</div>';
    }
  })();

  // ── Register service worker ──
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  </script>
</body>
</html>
